  <rect x="1150" y="900" width="70" height="60" fill="#b5643c"/><ellipse cx="1185" cy="890" rx="52" ry="40" fill="#4f7d45"/><ellipse cx="1170" cy="870" rx="30" ry="26" fill="#6c9a5b"/>
  <rect x="380" y="900" width="70" height="60" fill="#b5643c"/><ellipse cx="415" cy="890" rx="52" ry="40" fill="#4f7d45"/><ellipse cx="430" cy="872" rx="28" ry="24" fill="#6c9a5b"/>
  <!-- marciapiede -->
  <rect y="960" width="1600" height="40" fill="url(#street)"/>
  <rect y="955" width="1600" height="8" fill="#b9ad9b"/>
