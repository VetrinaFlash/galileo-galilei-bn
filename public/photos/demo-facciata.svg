  <path d="M0 330 h220 v-40 h120 v60 h160 v-30 h90 V1000 H0z" fill="#d2b08a" opacity=".55"/>
  <path d="M1250 300 h140 v-50 h210 V1000 H1250z" fill="#c89f74" opacity=".55"/>
