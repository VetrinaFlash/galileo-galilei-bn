      <g stroke="#2d2a26" stroke-width="3" fill="none">
        <path d="M-84 30v58M84 30v58M-84 30h168"/>
        <path d="M-64 34v54M-44 34v54M-24 34v54M-4 34v54M16 34v54M36 34v54M56 34v54M76 34v54"/>
        <path d="M-84 60 q21 -18 42 0 q21 18 42 0 q21 -18 42 0 q21 18 42 0" stroke-width="2"/>
      </g>
      <ellipse cx="-58" cy="26" rx="22" ry="14" fill="#5c8a4f"/><ellipse cx="-44" cy="20" rx="14" ry="10" fill="#76a463"/>
      <circle cx="-62" cy="18" r="4" fill="#d9534f"/><circle cx="-48" cy="14" r="4" fill="#e8746a"/><circle cx="-38" cy="22" r="3.5" fill="#d9534f"/>
      <rect x="-70" y="28" width="26" height="14" fill="#b5643c"/>
    </g>
