      <rect x="58" y="-90" width="46" height="180" fill="#3f6250"/>
      <g stroke="#2f4d3e" stroke-width="3">
        <path d="M-100 -70h38M-100 -50h38M-100 -30h38M-100 -10h38M-100 10h38M-100 30h38M-100 50h38M-100 70h38"/>
        <path d="M62 -70h38M62 -50h38M62 -30h38M62 -10h38M62 10h38M62 30h38M62 50h38M62 70h38"/>
      </g>
      <path d="M-70 -128h140l-14 22H-56z" fill="#efe1c8"/>
    </g>
    <g id="balcony">
